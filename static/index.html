<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deleuzian Thinking Machine</title>
    <meta name="description"
        content="An agentic philosophical system that performs Deleuzian philosophy rather than summarizing it.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">δ</div>
                <div class="logo-text">
                    <h1>Thinking Machine</h1>
                    <p class="tagline">after Deleuze</p>
                    <nav style="margin-top: var(--space-sm);">
                        <a href="/graph"
                            style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; text-decoration: none; border-bottom: 1px dotted var(--text-muted);">View
                            Rhizome Graph &rarr;</a>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Main content -->
        <main class="main">
            <!-- Configuration (Model & Budget) -->
            <section class="config-section"
                style="max-width: 800px; margin: 0 auto 1.5rem auto; padding: 0 1rem; display: flex; gap: 1.5rem; justify-content: flex-end; align-items: center; flex-wrap: wrap;">
                <div class="control-group" style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="model-select"
                        style="font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase;">Model:</label>
                    <select id="model-select"
                        style="padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-family: var(--font-sans);">
                        <option value="claude-sonnet-4-5-20250929">Sonnet 4.5</option>
                        <option value="claude-haiku-4-5-20251001">Haiku 4.5 (Fast)</option>
                        <option value="claude-opus-4-5-20251101">Opus 4.5</option>
                    </select>
                </div>

                <div class="control-group" style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="budget-range"
                        style="font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase;">Thinking
                        Budget: <span id="budget-value">8000</span></label>
                    <input type="range" id="budget-range" min="1024" max="32000" step="1024" value="8000"
                        style="width: 120px;">
                </div>
            </section>

            <!-- Question input -->
            <section class="input-section">
                <form id="question-form" class="question-form">
                    <div class="input-wrapper">
                        <textarea id="question-input" name="question"
                            placeholder="Ask a philosophical question... What is the relationship between desire and capitalism? How does the rhizome differ from the tree?"
                            rows="3" required></textarea>
                    </div>
                    <button type="submit" id="submit-btn" class="submit-btn">
                        <span class="btn-text">Think</span>
                        <span class="btn-icon">→</span>
                    </button>
                </form>
            </section>

            <!-- Response area -->
            <section id="response-section" class="response-section hidden">
                <!-- Process panel: combines thinking + tools in one collapsible area -->
                <div id="process-panel" class="process-panel hidden">
                    <button type="button" class="process-toggle" id="process-toggle">
                        <span class="toggle-icon">◐</span>
                        <span class="process-label">Process</span>
                        <span id="routing-badge" class="routing-badge"></span>
                        <span class="process-summary" id="process-summary"></span>
                        <span class="toggle-chevron">▼</span>
                    </button>
                    <div id="process-content" class="process-content collapsed">
                        <!-- Thinking section -->
                        <div id="thinking-section" class="thinking-section">
                            <div class="section-header">
                                <span>Thinking</span>
                                <span id="thinking-tokens" class="token-count"></span>
                            </div>
                            <div id="thinking-text" class="thinking-text"></div>
                        </div>
                        <!-- Tool calls section -->
                        <div id="tools-section" class="tools-section">
                            <div class="section-header">Tools Used</div>
                            <div id="flow-container" class="flow-container"></div>
                        </div>
                    </div>
                </div>

                <!-- Main response -->
                <div class="response-card">
                    <button id="copy-btn" class="copy-btn hidden" title="Copy to clipboard">
                        <span class="copy-icon">⧉</span>
                        <span class="copy-text">Copy</span>
                    </button>
                    <div id="response-text" class="response-text"></div>
                    <div id="cursor" class="cursor hidden">▌</div>
                </div>

                <!-- Sources -->
                <div id="sources-panel" class="sources-panel hidden">
                    <h3 class="sources-title">Sources</h3>
                    <ul id="sources-list" class="sources-list"></ul>
                </div>
            </section>

            <!-- Loading indicator -->
            <div id="loading" class="loading hidden">
                <div class="loading-rhizome">
                    <div class="node n1"></div>
                    <div class="node n2"></div>
                    <div class="node n3"></div>
                    <div class="node n4"></div>
                    <div class="node n5"></div>
                    <svg class="connections" viewBox="0 0 100 100">
                        <line class="line l1" x1="50" y1="50" x2="20" y2="20" />
                        <line class="line l2" x1="50" y1="50" x2="80" y2="25" />
                        <line class="line l3" x1="50" y1="50" x2="75" y2="75" />
                        <line class="line l4" x1="50" y1="50" x2="25" y2="80" />
                        <line class="line l5" x1="20" y1="20" x2="80" y2="25" />
                    </svg>
                </div>
                <p class="loading-text">Becoming...</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by Claude Opus 4.5 with Extended Thinking</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
